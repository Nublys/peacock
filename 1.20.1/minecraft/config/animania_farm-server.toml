
[farm]
	#Allow eggs to be thrown
	allowEggThrowing = false
	#Ticks cheese takes to mature
	#Range: 20 ~ 2400000
	cheeseMaturityTime = 24000
	#Adult female cows are milkable when spawned
	cowsMilkableAtSpawn = false
	#Allow sleeping using a wagon
	sleepAllowedWagon = true
	#Disable salt creation in cheese molds
	disableSaltCreation = false
	#Salt items produced by a cheese mold
	#Range: 1 ~ 64
	saltCreationAmount = 16
	#Disable carts and wagons
	disableRollingVehicles = false
	#Birds may lay eggs without a nest
	chickensDropEggs = false
	#Generate wild beehives
	hiveSpawning = true
	#Wild hive generation frequency
	#Range: 1 ~ 10
	hiveSpawningFrequency = 3
	#Wild hive honey creation rate
	#Range: 20 ~ 72000
	hiveWildHoneyRate = 700
	#Crafted hive honey creation rate
	#Range: 20 ~ 72000
	hivePlayermadeHoneyRate = 450
	#Legacy biome categories valid for hives
	hiveValidBiomeTypes = ["JUNGLE", "CONIFEROUS", "SWAMP", "FOREST", "PLAINS"]
	#Food items accepted by chicken
	chickenFood = ["minecraft:wheat_seeds", "minecraft:melon_seeds", "minecraft:beetroot_seeds", "minecraft:pumpkin_seeds", "simplecorn:corncob", "biomesoplenty:turnip_seeds", "harvestcraft:cornitem"]
	#Food items accepted by cow
	cowFood = ["minecraft:wheat", "simplecorn:corncob", "harvestcraft:barleyitem", "harvestcraft:oatsitem", "harvestcraft:ryeitem", "harvestcraft:cornitem"]
	#Food items accepted by goat
	goatFood = ["minecraft:wheat", "minecraft:string", "minecraft:stick", "minecraft:apple", "simplecorn:corncob", "harvestcraft:barleyitem", "harvestcraft:oatsitem", "harvestcraft:ryeitem", "harvestcraft:cornitem"]
	#Food items accepted by horse
	horseFood = ["minecraft:wheat", "harvestcraft:barleyitem", "harvestcraft:oatsitem", "harvestcraft:ryeitem", "minecraft:apple", "minecraft:carrot"]
	#Food items accepted by sheep
	sheepFood = ["minecraft:wheat", "harvestcraft:barleyitem", "harvestcraft:oatsitem", "harvestcraft:ryeitem"]
	#Food items accepted by pig
	pigFood = ["minecraft:carrot", "minecraft:beetroot", "minecraft:potato", "minecraft:poisonous_potato", "minecraft:bread"]
	#Preferred bed block for chicken
	chickenBed = "animania:block_straw"
	#Backup bed block for chicken
	chickenBed2 = "minecraft:grass"
	#Preferred bed block for cow
	cowBed = "animania:block_straw"
	#Backup bed block for cow
	cowBed2 = "minecraft:grass"
	#Preferred bed block for goat
	goatBed = "animania:block_straw"
	#Backup bed block for goat
	goatBed2 = "minecraft:grass"
	#Preferred bed block for horse
	horseBed = "animania:block_straw"
	#Backup bed block for horse
	horseBed2 = "minecraft:grass"
	#Preferred bed block for pig
	pigBed = "animania:block_straw"
	#Backup bed block for pig
	pigBed2 = "minecraft:grass"
	#Preferred bed block for sheep
	sheepBed = "animania:block_straw"
	#Backup bed block for sheep
	sheepBed2 = "minecraft:grass"
	#Roosters fight other roosters
	roostersFight = false

	[farm.spawning_and_breeding]
		#Remove naturally spawning vanilla cows and mooshrooms
		replaceVanillaCows = true
		#Remove naturally spawning vanilla pigs
		replaceVanillaPigs = true
		#Remove naturally spawning vanilla chickens
		replaceVanillaChickens = true
		#Remove naturally spawning vanilla sheep
		replaceVanillaSheep = true
		#Remove naturally spawning vanilla horses
		replaceVanillaHorses = true
		#Spawn Animania chickens in the world
		spawnAnimaniaChickens = true
		#Legacy spawn weight
		#Range: 0 ~ 1000
		spawnProbabilityChickens = 9
		#Nearby spawn limit
		#Range: 0 ~ 10000
		spawnLimitChickens = 40
		#Maximum family group size
		#Range: 1 ~ 64
		numberChickenFamilies = 2
