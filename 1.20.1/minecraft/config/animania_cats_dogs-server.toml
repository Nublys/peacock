
[catsdogs]
	#Food items accepted by cat
	catFood = ["minecraft:fish"]
	#Preferred bed block for cat
	catBed = "animania:cat_bed_1"
	#Backup bed block for cat
	catBed2 = "animania:cat_bed_2"
	#Nearby cat spawn limit
	#Range: 0 ~ 10000
	spawnLimitCats = 20
	#Nearby dog spawn limit
	#Range: 0 ~ 10000
