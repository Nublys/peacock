	#The vehicle's own tick destroys the cell in front of the hull every tick
	#and drops it as items, so a tank crossing a village tunnels through walls,
	#fences, houses and chests on its way to the fight - and an offline village
	#never repairs any of it. That is fine for a vehicle a player is steering
	#and choosing a route for; it is not fine for one the AI sends across its
	#own settlement.
	#
	#OFF by default, so a village tank drives around obstacles (see
	#pathfindObstacles) instead of through them. A player's own Laendli tank is
	#never affected either way - only vehicles this addon is driving.
	#
	#Turn it on to restore the vehicle mod's own behaviour. Default: false
	#
	ramDestroysBlocks = false
	#A village tank cannot kill its OWN side by driving over them.
	#
	#A tank crossing its own village square, or pushing through the line it is
	#fighting alongside, killed the soldiers it was sent to help - and from
	#outside that is indistinguishable from the vehicle being broken, because
	#nothing announces it and the victims simply die.
	#
	#The vehicle hurts what it drives into with a damage source that carries
	#NO attacker, so the culprit cannot be read off the damage and is
	#identified by position instead, from the same notes the block-ram guard
	#keeps. Scoped to unattributable damage, a victim that is not an enemy of
	#that tank, and only vehicles this addon is driving - a player's own
	#Laendli tank is untouched, and an enemy is still run over. Default: true
	#
	spareFriendlyRam = true
	#How high a step a village tank can drive up, in blocks.
	#
	#At 2.0 it climbs a two-block wall or ledge - which most terrain is full
	#of, and a tank that stopped at every one of them never reached the fight.
	#Laendli's own constructor sets 1.1, so this is a deliberate raise.
	#
	#⚠️ This is the ONLY way a tank gets up anything, because jumping is
	#refused (canJump below). That is the point: a step is bounded and
	#predictable, whereas a jump carries momentum and gets a vehicle onto
	#things nobody intended. Whatever you set here is genuinely the limit.
	#
	#WalkNodeEvaluator reads the mob's own step height when it decides whether
	#a node is reachable, so this also tells the route planner what the
	#vehicle can cross - without which a tank would repeatedly drive at a wall
	#it had been told it could climb.
	#
	#Re-asserted every pass, because it is a plain field on the entity and the
	#constructor's value comes back on every tank loaded from a save.
	#Default: 2.0
	#
	#Range: 0.5 ~ 4.0
	stepHeight = 2.0
	#Let a village tank JUMP. A tracked vehicle has no legs, and with this
	#off the ONLY way it gets up anything is stepHeight - which is then
	#genuinely the limit, instead of a floor a jump can add to.
	#
	#This is the setting that actually stops a tank climbing. The step height
	#never permitted two blocks; what did is that a tank is a PathfinderMob
	#and vanilla jumps it - MoveControl calls jump() the instant the mob
	#reports a horizontal collision, so a tank bumping a wall simply hopped
	#over it. This addon overrides where the vehicle steers, not whether it is
	#a mob, so that path ran untouched.
	#
	#true = the vehicle mod's behaviour, tanks climb by hopping.
	#Default: false
	#
	canJump = false
	#A tank goes after enemies it cannot currently SEE, pathfinding to them
	#instead of standing still.
	#
	#Line of sight decides whether the gun may fire - it is re-checked before
	#every round - and it used to decide something it had no business
	#deciding: whether there was anyone to go and find. With nothing visible
	#the tank had no target at all, drove to its objective, arrived, and then
	#sat there while enemies stood a few blocks away behind a rise or a wall.
	#That is the "tank stopped fighting" you see.
	#
	#A HIGHLIGHTED (glowing) enemy is pursued first among the unseen. Glowing
	#is this mod pointing everyone at somebody - a routed survivor, the last
	#defender of a besieged village - and those are exactly the ones nobody
	#can find, which is what the glow is for. The tank should be helping look,
	#not the one unit ignoring the signal.
	#
	#An enemy it CAN see always wins over one it cannot, whatever is glowing:
	#shooting something now beats driving off after something else.
	#Default: true
	#
	pursueUnseen = true
	#NO-BUILD ZONE, in blocks, around a tank factory.
	#Measured outward from the factory's own footprint, so this is clear
	#ground either side of the building and not a total radius.
	#Reported symptom it exists for: other buildings put up INSIDE the
	#factory. The city plan's spacing could not prevent that, because it
	#protects PLOTS and a factory is not always one - a sky village registers
	#its centre piece as a factory directly, and /vrtanks can place one - so a
	#plan drawn afterwards saw empty ground there. This is asked of the
	#factory's SITE record instead, which every factory has however it was
	#made, and it reads nothing from the world so it holds for an OFFLINE
	#village too.
	#0 = off (buildings may again be laid over a factory).
	#Range: 0 ~ 64
	factoryKeepOut = 6
	#REPAIR EXISTING SAVES: a village whose city plan says it built a tank
	#factory, on a plot where there is nothing standing, puts that plot back in
	#the build queue.
	#
	#Why a save can be in that state at all: the physical builder marks a plot
	#BUILT when the job is dispatched, not when the building is finished, on the
	#grounds that the job is saved to disk. That holds only while the job
	#survives - a builder that died and was never re-bought, or an abandoned
	#site, leaves the plot marked built over empty ground, and the build queue
	#skips every plot already marked built. So the village never tries again.
	#
	#For a house that is one missing house. For the factory it is the whole
	#tank subsystem: with factoryRequired the village can then never build a
	#tank or a shell, its crew is never hired, the order board never appears,
	#and nothing says why - every record insists the building is there.
	#
	#It will NOT touch: a plot with a registered production site on it (that
	#building was finished at least once, so an empty one was destroyed, which
	#is a different event); a plot whose village has a build job running right
	#now; a plot holding water, which the builder marks built on purpose so the
	#queue can move past ground it can never build on; a plot in an unloaded
	#chunk; or the same plot twice in one server session.
	#Default: true
	#
	factoryHealMissing = true
	#How long a works plot must be CONTINUOUSLY empty before factoryHealMissing
	#treats it as an abandoned job and puts it back in the queue.
