	#BUILT at dispatch, and the building then takes minutes to appear - it has
	#to be paid for in materials first, and the builder lays it block by block.
	#For that whole window the plot looks exactly like an abandoned job: marked
	#built, nothing standing yet. The heal reset one, the queue handed it out a
	#second time, the second dispatch re-derived its anchor a few blocks off its
	#street, and the village built the same works TWICE, side by side.
	#
	#Seen in a log as two opposite verdicts on one anchor about two minutes
	#apart: "claims a tank factory ... that was never built (0 blocks)" and then
	#"has a works standing ... (39 blocks)".
	#
	#The plot must now be seen empty on separate passes spanning this long, and
	#ANY sign of life - blocks appearing, a job taking the plot, a site being
