	#and a village nobody is near cannot be asked, so "asleep" is deliberately
	#NOT read as "over". That is right and it needed a bound: a besieged
	#village only ticks because the assault force-loads it, and when the siege
	#resolves that hold lapses within a couple of minutes. Unless a player
	#happens to be standing there the answer became "still fighting" for ever,
	#the vehicle and its crew were never removed, and the village never got
	#its tank back - so every AI-vs-AI siege that ended out of sight left an
	#undriveable hulk in the world until the next world load.
	#
	#Nothing is lost by giving up: the tank is credited back to its shed the
	#moment its chunk comes round again.
	#
	#0 = the old behaviour, wait for ever. Default: 2400 ticks (2 minutes)
	#
	#Range: 0 ~ 72000
	siegeUnloadedGiveupTicks = 2400
	#Count a faction's tanks in its military strength.
	#
	#Without this, tanks are invisible to every strategic decision in the
	#mod: a village can build an armoured column and still read as exactly as
	#strong as the day it had none. Its neighbours weigh it as easy prey, it
	#weighs ITSELF as too weak to attack anyone, and the rebellion scorer sees
	#a faction that cannot defend its own outposts - so the one thing it spent
	#45,000 research points and its whole metal industry on appears in no
	#number anybody consults.
	#
	#Counts tanks parked in a village's shed AND any currently out at a
	#fight, since a vehicle leaves the shed the moment it rolls out and a
	#faction should not read as weaker for the minutes it is using its
	#armour. Default: true
	#
	threatAssessment = true
	#What ONE tank is worth in military strength, on the same scale a soldier
	#is measured with (assessment/CombatStrength).
	#
	#For reference on that scale: an unloaded or paper recruit is 1.0, an
	#ordinary armoured soldier lands around 2-4, and a well-armoured one
	#carrying a firearm around 5-7. So the default of 12 makes a tank worth
	#roughly two to four good soldiers before the multiplier below - a
	#significant asset, not one that makes a village unattackable.
	#
	#0 = tanks are not counted at all (the same as turning threatAssessment
	#off, but leaves the rest of this section alone).
	#
	#Range: 0.0 ~ 500.0
	tankStrength = 12.0
	#How much MORE an enemy's tank is worth to a faction that has no way of
	#shooting back at it.
	#
	#A tank is immune to arrows outright and to musket balls unless the
	#shooter's faction has researched Armor Piercing, so the same vehicle is a
	#serious problem to a faction of bowmen and an ordinary target to one
	#fielding TACZ rifles. A faction counts as able to answer armour if it has
	#Armor Piercing, or Warium/TACZ firearms (with their Recruits bridge
	#installed - the guns do nothing in a recruit's hands without it), or
	#tanks of its own.
	#
	#Applied only where an observer exists: the threat a faction feels from a
	#hostile neighbour. It is symmetric by construction - everyone weighs
	#everyone else's armour by what they can themselves do about it - so two
	#equally-equipped factions still read each other identically.
	#
	#1.0 = no surcharge; armour is worth the same to everybody. Default: 2.0
	#
	#Range: 1.0 ~ 10.0
	threatHelplessMultiplier = 2.0

