
#Tech tree: research costs, research pace, AI research, admin bans.
[technology]
	#Master switch. false = the whole tech tree stops existing:
	#nothing can be researched and every already-researched technology
	#stops applying (levels are KEPT, so turning this back on restores them).
	enabled = true
	#STARTER TECHNOLOGY: every faction opens with ONE free technology,
	#granted instantly and costing nothing.
	#A new faction starts with an empty tree and a long climb to anything
	#that changes how it fights, so every faction's first hour is the same.
	#The starter pick is the opening move - muskets early, a bigger
	#warehouse, horsemen - and it is the first thing about a faction that
	#is a CHOICE rather than an outcome.
	#The pool is every TIER-1 technology that is implemented and whose mod
	#is installed; it is derived, not listed, so it can never offer a pick
	#that does nothing.
	#It is a HEAD START, not a lock: everything in the pool stays in the
	#tree and can still be researched normally afterwards.
	#An AI faction picks for itself; a player faction's leader picks from
	#the Research screen. Default: true
	starterTechEnabled = true
	#SECOND RESEARCH SLOT: a faction large enough runs TWO research jobs
	#at the same time, each advancing at the faction's full rate.
	#Research is otherwise one job at a time no matter how big a faction
	#grows, so a capital of eighty villagers advances down the tree in the
	#same single file as a two-house hamlet. The second slot is what a
	#grown village is FOR.
	#Both jobs are still paid for separately and in full up front, so the
	#second slot buys parallelism, never a discount.
	#false = one job per faction, whatever its size. Default: true
	parallelResearchEnabled = true
	#Villagers a faction needs before its SECOND research slot opens,
	#counted from the population ledger across every village it owns (so
	#offline villages count, exactly as they do for research speed).
	#A job already running is never cancelled if the population later
	#falls below this: the materials were already paid.
	#0 = two slots from the start. Ignored when parallelResearchEnabled
	#is false.
	#Range: 0 ~ 100000
	secondSlotMinPopulation = 30
	#Global multiplier on every MATERIAL and INGOT research cost.
	#2.0 = everything costs twice as much. Retunes the whole tree at once.
	#Range: 0.0 ~ 100.0
	costMultiplier = 1.0
	#Global multiplier on every RESEARCH POINT requirement, i.e. on how
	#long research takes once it has been paid for.
	#Range: 0.01 ~ 100.0
	researchMultiplier = 1.0
	#Cost growth per level of a multi-level technology: level N costs
	#base x growth^(N-1), for materials and research time alike.
	#1.0 = every level costs the same as the first.
	#Range: 1.0 ~ 10.0
	levelCostGrowth = 1.6
	#How often research progress is added, in ticks (200 = 10s).
	#The per-second rates below are scaled to this, so changing the
	#interval changes the CPU cost of research, not its speed.
	#Range: 20 ~ 12000
	researchIntervalTicks = 200
	#Research points per SECOND a faction earns regardless of size.
	#This is the floor that stops a devastated village researching at 0.
	#Range: 0.0 ~ 1000.0
	researchBaseRate = 0.5
	#Extra research points per second per VILLAGER (from the population
	#ledger, so offline villages still count).
	#Range: 0.0 ~ 100.0
	researchPerVillager = 0.08
	#Extra research points per second per WORKER. Workers are worth more
	#than plain villagers: they are the ones actually producing.
	#Range: 0.0 ~ 100.0
	researchPerWorker = 0.25
	#Let AI village factions choose and start their own research.
	#false = only player factions ever research, and AI villages stay
	#at whatever level an admin granted them.
	aiResearchEnabled = true
	#Minimum ticks between two research decisions by the SAME AI faction
	#(6000 = 5 minutes). Only idle factions are ever evaluated.
	#Range: 20 ~ 720000
	aiCooldownTicks = 6000
	#How much extra an AI faction wants the FIREARM branch (Gunpowder,
	#Basic Firearms, Musketry, Firearm Machining, Precision Firearms),
	#as a bonus on its research score.
	#The AI otherwise ranks technologies by DEPTH and cost, and firearms
	#are the deepest and dearest branch in the tree - so they came dead
	#last behind every filler technology and no AI village ever fielded a
	#gun. That was never a balance decision, just what falls out of the
	#ordering.
	#It is added to the score, not a branch override: an undefended village
	#still researches Militia before guns. Techs whose mod is not installed
	#are already excluded, so this can never make an AI chase a dead entry.
	#0 = the old ordering (guns last). Default: 60.0
	#Range: 0.0 ~ 1000.0
	aiFirearmPriority = 60.0
	#A faction that MEETS a battle tank starts researching an answer to it.
	#Armour is the one thing a faction cannot fight its way out of: a musket
	#ball is refused outright without Armor Piercing and an arrow can never
	#get through at all, so a village that reacts to a tank by building more
	#musketeers is doing the one thing that provably cannot work. The
	#ordinary research scorer ranks by branch, depth and cost - none of which
	#knows that something in the world has just made a whole line of troops
	#useless.
	#It pushes Armor Piercing and Battle Tanks, or - when the faction lacks
	#them - the first PREREQUISITE it could actually start, since a
	#technology whose prerequisites are unmet is not offered at all and
	#wanting it would achieve nothing.
	#Goes quiet the moment the faction can answer armour by any route.
	#Needs Laendli Transportation to mean anything. Default: true
	armourAlarmEnabled = true
	#How long a faction keeps reacting to the last tank it met.
	#A fight is over in minutes while the research decision comes round on
	#its own cooldown, possibly in a village on the other side of the map, so
	#the sighting has to be remembered - and it has to expire, or a war
	#fought days ago would still be steering research today.
	#Default: 72000 ticks (one hour of play, three Minecraft days)
	#Range: 1200 ~ 1728000
	armourAlarmTicks = 72000
	#How much extra an alarmed faction wants the answer to armour, as a
	#bonus on its research score. Higher than aiFirearmPriority by default:
	#that one lifts a branch the AI generally under-values, this one is a
	#reaction to a specific threat that is already killing its soldiers.
	#Added to the score, not a branch override - an undefended village still
	#researches Militia first.
	#0 = off (the same as armourAlarmEnabled false). Default: 90.0
	#Range: 0.0 ~ 1000.0
	armourResearchPriority = 90.0
	#A faction that meets a tank warns its ALLIES, and they start
	#researching an answer too.
	#An alliance that does not share this is one in name only: a tank is
	#immune to arrows and to muskets without Armor Piercing, so an ally
	#marching to help - which the call to arms exists to make it do -
	#arrives with weapons that cannot touch the thing doing the killing,
	#and finds out by losing an army.
	#They inherit the ALARM, not the sighting: each ally then researches on
	#its own terms, and one that can already answer armour ignores it.
	#ONE hop, never passed on again - a chain of alliances would otherwise
	#put every faction in the world on a war footing over one tank.
	#Default: true
	armourAlarmWarnAllies = true
	#Tell an allied faction's online members, in chat, when they are warned
	#about armour. Turn off to keep the research reaction without the
	#message. Default: true
	armourAlarmAnnounce = true
	#Technologies banned on this server, by key. A banned technology
	#cannot be researched, stops applying if already researched, and
	#refunds any research in progress.
	#Keys: militia, bow_charge, shield_breaking, crossbow_charge,
	#formations, garrisons, downed_revive, walls, siege_weapons,
	#turrets, navy_seals, mercenaries, capacity,
	#lockpicker, carrot_farming, mushroom_farming, flower_farming,
	#golden_foods, horses, neutral_mobs, guns, muskets,
	#firearm_machining (Warium), precision_firearms (TACZ)
	#Example: ["muskets", "guns"]
	disabledTechs = []
	#[capacity] Extra material stockpile cap per level, as a fraction of
	#the base cap. 0.25 = +25% per level, so level 3 = +75%.
	#Range: 0.0 ~ 10.0
	capacityBonusPerLevel = 0.25
	#[navy_seals] Chance per LEVEL that a promotion produces an ELITE
	#instead of an ordinary upgrade. 0.01 = 1% at level 1, 3% at level 3.
	#Applies to player and AI factions alike.
	#Range: 0.0 ~ 1.0
	specialForcesChancePerLevel = 0.01
	#The VILLAGE leader starts research for a PLAYER faction when its
	#player leader is not doing so. Free slots only - anything the leader
	#started is never touched - and a member's request is preferred over
	#the village's own reading of the situation.
	#Without this a faction whose leader logs off, or who simply never
	#opens the research screen, sits on a full warehouse and advances not
	#at all while every AI village around it keeps teching.
	#Members are told in chat what was started, because the steward spends
	#the faction's materials. Default: true
	playerAutoResearchEnabled = true
	#How long every slot must sit idle before the village leader steps in
	#while the player leader is ONLINE. Offline there is nobody to defer
	#to and it acts at the ordinary AI cooldown.
	#The grace exists so a leader who just finished a project and is
	#deciding what to buy next does not find the choice made for him.
	#Default: 12000 (10 minutes)
	#Range: 0 ~ 1728000
	playerAutoResearchGraceTicks = 12000
	#[elite_training] Chance per LEVEL that a soldier rises to ELITE on
	#one roll. 0.005 = 0.5% at level 1, 1.5% at level 3.
	#Unlike navy_seals this is rolled on a TIMER, not on promotion, so a
	#long-serving soldier who is never upgraded can still earn it.
	#Range: 0.0 ~ 1.0
	eliteTrainingChancePerLevel = 0.005
	#[elite_training] Ticks between rolls for each soldier.
	#⚠️ The cadence is the whole balance of this technology, not the
	#chance. At 0.5% rolled every 10 seconds an army is entirely ELITE
	#within the hour; rolled once per Minecraft day it is a slow, visible
	#reward for keeping men alive. Raise the chance to make elites more
	#common; lower this only if you want them to arrive in a rush.
	#Default: 24000 (one Minecraft day)
	#Range: 200 ~ 1728000
	eliteTrainingIntervalTicks = 24000
	#[combat_medics] Master switch for the tier-1 Combat Medics ability.
	#Off = the technology can still be researched but no soldier ever acts
	#as a medic. Existing medics keep their tag and simply stop throwing.
	combatMedicEnabled = true
	#[combat_medics] Chance that an ordinary soldier trains as a combat
	#medic. Rolled ONCE per soldier and remembered - he is never asked
	#again, win or lose, because a chance re-rolled every second is not a
	#25% chance of anything: every soldier alive long enough would end up
	#wearing a cross.
	#Elites never roll (they have Battle Medics), and neither do the elected
	#leader or a commander - the healing-first posture would pull an officer
	#out of the fight he is leading.
	#Default: 0.25
	#Range: 0.0 ~ 1.0
	combatMedicChance = 0.25
	#[combat_medics] THE DYNAMIC CAP: one combat medic per this many
	#soldiers in the village, recomputed as the garrison grows or shrinks.
	#Integer division, so a village below the ratio gets NO medic rather
	#than a fraction of one - which is what stops a four-man hamlet from
	#being a two-man hospital.
	#A soldier refused by the cap is left UNROLLED and asked again later,
	#so a village that later doubles in size does fill its new slots.
	#Set to 0 to remove the cap entirely and let the chance roll alone
	#decide - not recommended, that is how you get an army of medics.
	#Default: 6 (a 30-man garrison fields 5)
	#Range: 0 ~ 200
	combatMedicPerSoldiers = 6
	#[combat_medics] Ticks before a combat medic's single potion is back.
	#A combat medic gets ONE throw and then this wait, where an elite battle
	#medic gets three throws that recover together - so at the defaults the
	#rank-and-file medic throws one potion per 600 ticks against the elite's
	#one per 400, on top of the weaker potion.
	#Default: 600 (thirty seconds)
	#Range: 20 ~ 72000
	combatMedicCooldownTicks = 600
	#[combat_medics] How far a combat medic looks for a wounded ally.
	#Range: 2.0 ~ 48.0
	combatMedicRange = 10.0
	#[combat_medics] A combat medic will not throw at a PATIENT who has an
	#enemy within this radius - a splash potion lands on the man being
	#healed, so thrown into a melee it heals whoever is fighting him too.
	#The question is about the patient, never about the medic: a medic in
	#contact can still treat the men who have pulled back behind him.
	#Range: 0.0 ~ 64.0
	combatMedicSafeRadius = 16.0
	#[combat_medics] Only heal an ally below this fraction of its maximum
	#health. 0.6 = wait until someone is under 60%.
	#Range: 0.05 ~ 1.0
	combatMedicHealBelow = 0.6
	#[combat_medics] A combat medic with somebody to treat stops looking
	#for a fight until there is nobody left to treat. With a single charge
	#this window is short by construction - it lapses the moment the potion
	#is thrown.
	#It still DEFENDS itself: the rule refuses a NEW target, never the enemy
	#already hitting it.
	combatMedicHealingFirst = true
	#[battle_medics] Potions an elite may throw before it must wait out
	#the cooldown. Default: 3
	#Range: 1 ~ 32
	battleMedicCharges = 3
	#[battle_medics] Ticks before a spent medic recovers all its charges.
	#Default: 1200 (one minute)
	#Range: 20 ~ 72000
	battleMedicCooldownTicks = 1200
	#[battle_medics] How far an elite looks for a wounded ally to heal.
	#Range: 2.0 ~ 48.0
	battleMedicRange = 10.0
	#[battle_medics] A medic will not throw at a PATIENT who has an enemy
	#within this radius - a splash potion lands on the man being healed, so
	#thrown into a melee it heals whoever is fighting him too.
	#It used to ask about the MEDIC instead, which meant a medic in contact
	#could not heal at all - and in a battle it nearly always is, which is
	#exactly when men need patching. A medic now fights and treats the men
	#who have pulled back, in the same breath.
	#Range: 0.0 ~ 64.0
	battleMedicSafeRadius = 16.0
	#[battle_medics] The mark put on a medic's name, in bright red before
	#the name itself. Every elite of a faction that has researched Battle
	#Medics is one, so this is how you tell them apart in the field.
	#It is a config string and not a fixed glyph on purpose: whether a
	#character renders depends on the font in use, and a marker that shows
	#as a missing-glyph box is worse than none. Set it to + if the cross
	#does not display, or to nothing at all to turn the mark off.
	battleMedicSymbol = "✚"
	#[battle_medics] Only heal an ally below this fraction of its maximum
	#health. 0.6 = wait until someone is under 60%.
	#Range: 0.05 ~ 1.0
	battleMedicHealBelow = 0.6
	#[battle_medics] A medic with wounded to treat stops looking for a
	#fight until there are none left.
	#Healing and fighting were never in competition for the medic's TIME -
	#the throw is free - they were in competition for where it STOOD. Left
	#to the ordinary elite behaviour it charged into the melee like any
	#other soldier, which is the place furthest from the men it exists to
	#keep alive and the place it gets killed early.
	#It still DEFENDS itself: the rule refuses a new target, never the one
	#already hitting it, so a medic being cut down fights back. It also
	#lasts no longer than the work does - the moment there is nobody left
	#to heal, or the medic is out of charges, it is an elite soldier again.
	#false = the old behaviour, fights and heals at once. Default: true
	battleMedicHealingFirst = true
	#[shield_breaking] Chance per LEVEL that an ordinary melee blow by
	#this faction breaks a blocking shield, as an axe does.
	#0.15 = 15% at level 1, 30% at level 2.
	#Range: 0.0 ~ 1.0
	shieldBreakChancePerLevel = 0.15

