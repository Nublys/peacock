# Simple Voice Chat — server. Shipped by the pack and copied over config/ on the server only.
# port=-1 makes voice chat use the Minecraft server port (UDP). Pterodactyl allocations open TCP+UDP
# on the same port, so no second allocation is needed.
port=-1
bind_address=
max_voice_distance=48.0
crouch_distance_multiplier=1.0
whisper_distance_multiplier=0.5
codec=VOIP
mtu_size=1024
keep_alive=1000
enable_groups=true
open_groups=false
voice_host=
allow_recording=true
spectator_interaction=false
spectator_player_possession=false
force_voice_chat=false
login_timeout=10000
broadcast_range=-1.0
allow_pings=true
