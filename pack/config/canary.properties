# Peacock — Canary (Lithium for Forge) options. Added 2026-10-17 after a Spark profile showed 44% of the
# server thread in vanilla villager AI (Brain → AcquirePoi → PathFinder). Canary's ai.poi / ai.pathing /
# ai.nearby_entity_tracking groups target exactly that.
#
# Disabled, defensively, where other packs have seen friction:
#   block_entity_ticking  — Create's belts/contraptions tick block entities in their own way
#   entity.collisions     — was for Valkyrien Skies (removed 2026-10-24); still off until tested with Create
#   chunk.serialization   — not worth the risk for the gain
# Everything else stays at Canary's default (true). Remove a line to re-enable; add `<key>=false` to disable.
mixin.world.block_entity_ticking=false
mixin.entity.collisions=false
mixin.chunk.serialization=false
# ai.poi was off 2026-10-17 → 2026-10-24: its PoiManagerMixin and Valkyrien Skies' MixinPOIManager could not both
# apply (server stopped). Valkyrien Skies is gone (2026-10-24), so it is back on: villagers looking for a bed or a
# job site (AcquirePoi) were 8.6% of the tick in the 2026-10-24 profile, nearly all of it the POI lookup.
# 2026-10-17: a main-thread chunk load (Village Recruits laying a road into an ungenerated chunk) parked in
# Canary's getChunkBlocking for 180 s until the watchdog fired. Vanilla's blocking path keeps draining the
# main-thread task queue while it waits; keep that one.
mixin.world.chunk_access=false
