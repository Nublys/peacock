# Peacock: only the keys the pack changes. Forge fills in every other key with Cold Sweat's default on first load.
# Temperatures here are in Cold Sweat's internal unit (MC): MC = (°F - 32) / 45.

[Builtin]
	# custom: the habitable range below is the pack's own, not a difficulty preset
	Difficulty = "custom"
	# off, so a Cold Sweat update cannot rewrite these values to its new defaults
	"Auto Update" = false

[Difficulty]
	# Aaron: comfortable is 35-100 °F (2026-10-21; 45-100 on 2026-10-20; Cold Sweat's default 50-100). The world
	# gauge reads "freezing" below this minimum, and at 45 ordinary nights did; 35 keeps cool nights fine while frost,
	# snow, mountains and winter still bite.
	# 35 °F
	"Minimum Habitable Temperature" = 0.06666666666666667
	# 100 °F (unchanged)
	"Maximum Habitable Temperature" = 1.511111111111111
