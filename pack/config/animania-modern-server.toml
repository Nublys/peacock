
#Modern UI additions. Original husbandry rules are in animania-server.toml.
[husbandry]
	#Disable hunger for these Animania animals. Use entity IDs, * wildcards, or groups:
	#cats (including ocelots), dogs, wolves, foxes, cows, pigs, sheep, goats, horses, chickens, peafowl, rabbits, hamsters, hedgehogs, ferrets, axolotls.
	#Examples: ["cats", "animania:*_draft"]. Use ["*"] for all. Feeding, taming and breeding remain available.
	hungerBlacklist = []
	#Disable thirst for the same entity IDs, wildcards or groups supported by hungerBlacklist.
	thirstBlacklist = []
	#Species-specific mood for player-fed, tamed or penned animals. Wild animals are unaffected.
	animalMood = true
	#Apply reduced production and breeding readiness when husbandry mood is low.
	moodPenalties = true
	#No mood bonuses or penalties during the initial settling-in period, in world calendar ticks. Sleeping through the night counts. Default: 72000 (three Minecraft days).
	#Range: 0 ~ 720000
	moodGraceTicks = 72000
	#Health restored when an animal uses a salt lick.
	#Range: 0.0 ~ 100.0
	saltLickHealing = 2.0

#Additional farm tuning. Legacy production timers are in animania_farm-server.toml.
[farm]
	#Honey produced per successful cycle, in millibuckets.
	#Range: 1 ~ 1000
	hiveHoneyPerCycle = 25
	#Damage dealt by a disturbed wild hive.
	#Range: 0.0 ~ 100.0
	wildHiveDamage = 2.5

#Natural spawning switches. Spawn weights and biome lists remain data-pack configurable.
[spawning]
	#Master switch for replacing vanilla animals. False keeps vanilla spawning alongside enabled Animania spawns.
	#Does not restore previously replaced animals or add extra spawns for replacement-only breeds. Restart the world after changing spawning options.
	replaceVanillaAnimals = true
	#Replace newly spawned vanilla cats, including village cats. Independent of the legacy ocelot switch.
	replaceVanillaCats = true
	enableFarmSpawns = true
	enableExtraSpawns = true
	enablePetWildlifeSpawns = true
	#Replace new natural axolotls; existing animals and bucket releases are kept.
	replaceAxolotls = true
	#Replace newly generated bees, including occupants of new bee nests; saved bees are kept.
	replaceBees = true
	#Replace newly spawned wild foxes; saved and player-created animals are kept.
	replaceModernFoxes = true
	#Replace newly spawned mountain goats with cared-for mountain goats.
	replaceMountainGoats = true

