name: release

# Tag a commit `vX.Y.Z` (matching pack/pack.toml's version) and this builds the launcher-importable
# packages and attaches them to a GitHub release:
#   Peacock-Prism.zip                      Prism Launcher instance (Add Instance → Import): Forge, memory, JVM flags
#                                          and the launch.jar pre-launch command preset; syncs from main on launch.
#                                          Also committed as dist/Peacock-Prism.zip so it has a stable raw URL.
#   Peacock-X.Y.Z.mrpack                   Modrinth App / ATLauncher import (CurseForge-hosted mods are embedded as
#                                          overrides, so --restrictDomains=false; fine for our own distribution,
#                                          not for a Modrinth listing). Ships the `low` defaults.
#   Peacock-X.Y.Z-curseforge-<tier>.zip    CurseForge App import, one per hardware tier (potato, low, medium, high,
#                                          ultra) with that tier's profile baked in (tools/apply-profile.py),
#                                          because the CurseForge app has no pre-launch hook to run launch.jar.
#   Peacock-X.Y.Z-server.zip               server files (mods, configs, datapacks, KubeJS) for a bare-metal start
# Players on the Prism + launch.jar route never need a release; they sync from main directly.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Tag matches pack.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' pack/pack.toml)
          [ "$TAG" = "$VER" ] || { echo "::error::tag v$TAG but pack.toml says $VER"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Export
        working-directory: pack
        run: |
          ~/go/bin/packwiz refresh
          git diff --exit-code -- index.toml pack.toml
          ~/go/bin/packwiz modrinth export --restrictDomains=false -o "../Peacock-${VER}.mrpack"
          cp "../Peacock-${VER}.mrpack" ../Peacock.mrpack      # stable name for releases/latest/download/Peacock.mrpack
          ~/go/bin/packwiz curseforge export -s server -o "../Peacock-${VER}-server.zip"
      - name: CurseForge zips, one per hardware tier
        run: |
          for tier in potato low medium high ultra; do
            rm -rf /tmp/tier && cp -r pack /tmp/tier
            python3 tools/apply-profile.py "$tier" /tmp/tier
            (cd /tmp/tier && ~/go/bin/packwiz refresh && ~/go/bin/packwiz curseforge export -o "${GITHUB_WORKSPACE}/Peacock-${VER}-curseforge-${tier}.zip")
          done
      - name: Prism instance
        run: |
          python3 tools/build-instance.py
          cp dist/Peacock-Prism.zip Peacock-Prism.zip
      - name: Release notes
        run: |
          {
            echo "Peacock ${VER} — Forge 1.20.1 ($(grep -c '^\[\[files\]\]' pack/index.toml) files, $(ls pack/mods | wc -l) mods)"
            echo
            echo "Install guides: docs/INSTALL-MODRINTH.md (Peacock.mrpack), docs/INSTALL-PRISM.md (Peacock-Prism.zip) and docs/INSTALL-CURSEFORGE.md (pick the zip for your hardware tier). Prism users sync from main and never need a new release."
            echo
            echo "Changes since the previous tag:"
            PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then git log --no-merges --format='- %s' "$PREV..${GITHUB_REF_NAME}"; else git log --no-merges --format='- %s' -20; fi
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            Peacock-Prism.zip
            Peacock-${{ env.VER }}.mrpack
            Peacock.mrpack
            Peacock-${{ env.VER }}-curseforge-potato.zip
            Peacock-${{ env.VER }}-curseforge-low.zip
            Peacock-${{ env.VER }}-curseforge-medium.zip
            Peacock-${{ env.VER }}-curseforge-high.zip
            Peacock-${{ env.VER }}-curseforge-ultra.zip
            Peacock-${{ env.VER }}-server.zip
