name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Index is fresh
        working-directory: pack
        run: |
          ~/go/bin/packwiz refresh
          git diff --exit-code -- index.toml pack.toml \
            || { echo "::error::index.toml/pack.toml are stale — run 'packwiz refresh' in pack/ and commit"; exit 1; }
      - name: Validate pack
        run: python3 tools/validate.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Compared as disassembly, constant-pool numbers stripped: javac builds differ byte-for-byte between JDK
      # releases (this runner's JDK 21 vs the one launch.jar was built with), so a byte compare failed every push.
      - name: launch.jar matches its source
        run: |
          mkdir -p /tmp/committed && (cd /tmp/committed && jar xf "$GITHUB_WORKSPACE/pack/peacock/launch.jar" Launch.class)
          sh tools/build-launch.sh
          norm() { javap -c -p "$1" | sed -E 's/#[0-9]+(, *[0-9]+)?//g; s/^ *[0-9]+: //'; }
          diff <(norm /tmp/committed/Launch.class) <(norm build/launch/Launch.class) > /tmp/launch.diff \
            || { cat /tmp/launch.diff | head -40; echo "::error::pack/peacock/launch.jar is stale — run tools/build-launch.sh and commit"; exit 1; }
          git checkout -- pack/peacock/launch.jar dist/Peacock-Prism.zip
      - name: Profiles match the generator
        run: |
          python3 tools/gen-profiles.py
          git diff --exit-code -- pack/peacock/profiles \
            || { echo "::error::pack/peacock/profiles is stale — run tools/gen-profiles.py and commit"; exit 1; }
      - name: Almanac matches the generator
        run: |
          python3 tools/gen-almanac.py
          git diff --exit-code -- pack/patchouli_books \
            || { echo "::error::pack/patchouli_books is stale — run tools/gen-almanac.py and commit"; exit 1; }
